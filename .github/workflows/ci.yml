name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Base installation import smoke (no extras)
        run: |
          uv sync --frozen
          uv run --no-sync pytest tests/test_base_install.py
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -m 'not smoke'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
  browser-smoke:
    # Ubuntu 24.04 restricts nested unprivileged user namespaces via AppArmor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f runtime/project-browser/Dockerfile.smoke -t webuddy-browser-smoke .
      - run: docker run --rm --privileged webuddy-browser-smoke
