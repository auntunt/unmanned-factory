[project]
name = "unmanned-factory"
version = "0.1.0"
description = "webuddy — a customizable AI workspace for planning, execution, verification, and delivery"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.50",
    "PyYAML==6.0.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
]

# 文档里从第一天就写着 `factory run ...`，但这个入口点一直不存在 ——
# `uv run factory --help` 报 "Failed to spawn: factory"。补上而不是改文档：
# 文档描述的是意图中的接口，而 `python -m factory.cli` 这种写法会渗进
# plist、cron、README 的每一行。
[project.scripts]
factory = "factory.cli:main"
factory-web = "factory.control.app:main"
factory-runtime = "factory.control.runtime_cli:main"
factory-sources = "factory.control.source_cli:main"

[project.optional-dependencies]
codex = [
    "openai-codex>=0.147.0",
]
claude = [
    "claude-agent-sdk>=0.2.152",
]
dsh = [
    "deepseek-harness-sdk>=0.1.2rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["smoke: 需要真实调用 claude CLI 的端到端测试"]
