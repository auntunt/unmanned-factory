[project]
name = "unmanned-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.50",
    "PyYAML==6.0.2",
]

# 文档里从第一天就写着 `factory run ...`，但这个入口点一直不存在 ——
# `uv run factory --help` 报 "Failed to spawn: factory"。补上而不是改文档：
# 文档描述的是意图中的接口，而 `python -m factory.cli` 这种写法会渗进
# plist、cron、README 的每一行。
[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["smoke: 需要真实调用 claude CLI 的端到端测试"]
