[project]
name = "unmanned-factory"
version = "0.1.0"
description = "webuddy — a customizable AI workspace for planning, execution, verification, and delivery"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.50",
    "PyYAML==6.0.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "cryptography>=50.0.0",
    # 职能包：工具契约的 schema 自检与输入/输出校验（jsonschema），以及依赖声明的
    # 解析与版本约束比对（packaging）。两者此前只作为可选 extra 的传递依赖出现，
    # 控制面直接用它们就必须显式声明——否则最小安装下 import 失败。
    "jsonschema>=4.20.0",
    "packaging>=23.2",
    # multipart 上传（会话附件、职能包调用的文件输入）。FastAPI 只有在装了它之后才能
    # 构造带 Form/File 的路由——缺它时 create_app 直接抛 RuntimeError，服务起不来。
    # 此前只作为 claude extra 的传递依赖（mcp → python-multipart）存在，最小安装必挂。
    "python-multipart>=0.0.9",
]

# 文档里从第一天就写着 `factory run ...`，但这个入口点一直不存在 ——
# `uv run factory --help` 报 "Failed to spawn: factory"。补上而不是改文档：
# 文档描述的是意图中的接口，而 `python -m factory.cli` 这种写法会渗进
# plist、cron、README 的每一行。
[project.scripts]
factory = "factory.cli:main"
factory-web = "factory.control.app:main"
factory-runtime = "factory.control.runtime_cli:main"
factory-sources = "factory.control.source_cli:main"
webuddy-maintenance = "factory.control.maintenance_cli:main"

[project.optional-dependencies]
codex = [
    "openai-codex>=0.147.0",
]
claude = [
    "claude-agent-sdk>=0.2.152",
]
dsh = [
    "deepseek-harness-sdk>=0.1.2rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["smoke: 需要真实调用 claude CLI 的端到端测试"]
