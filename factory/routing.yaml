# 模型分级路由表。手工维护 —— 这是有意的选择：
# 榜单和发布时间由人看，表由人改，代码不猜。
#
# 列表 = 重试阶梯：第 1 轮用第 1 个，第 2 轮用第 2 个，超出则钉在最后一个。
#
# 不从 haiku 起步。省下的那点钱换不来什么 —— haiku 在真实编码任务上
# 大概率第一轮就打不过，于是白烧一轮的 token 和墙上时间，还得等它失败
# 才升级。sonnet 起步等于把「注定失败的第一轮」直接跳过。
#
# 廉价模型该用在判断题上，不是生产代码：切分、权限审批那种一次调用
# $0.001 的场合（intake/split.py、permission/approver.py）继续用 haiku。
default: [sonnet]
by_class:
  A: [sonnet, opus, opus]
  B: [sonnet, opus, opus]
  # C/D 永不无人，这里留着只为「万一人工放行后仍走本管道」时有个强模型兜底
  C: [opus]
  D: [opus]
